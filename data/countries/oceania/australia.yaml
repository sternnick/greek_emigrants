  dispute_note:
    el: 'Προηγούμενη καταχώριση: 424.000 — δεν υπάρχει σε κανένα κελί του παρατιθέμενου αρχείου ABS. Το βιβλίο εργασίας
      δεν αποθηκεύει αναγνώσιμες κεφαλίδες στηλών: η γραμμή «Greek» (φύλλο 5) δίνει 301.829 | 384.688 | 152.571 | 103.914
      | 137.255 | 8.460 | 4.393 | 15.219 με τελική στήλη 1.108.364 (άθροισμα προηγουμένων = 1.108.329), δηλαδή οι στήλες
      είναι υποσύνολα συν σύνολο — αλλά ποια στήλη είναι το εθνικό σύνολο δεν επαληθεύεται χωρίς ετικέτες. Σημείωση:
      η τιμή 424.744 ανήκει στη γραμμή «French» του ίδιου φύλλου. count=null έως την ανάγνωση πίνακα ancestry του ABS
      με κεφαλίδες (backlog).'
    en: 'Previous record: 424,000 — present in no cell of the cited ABS file. The workbook stores no readable column
      headers: the ''Greek'' row (sheet 5) reads 301,829 | 384,688 | 152,571 | 103,914 | 137,255 | 8,460 | 4,393 | 15,219
      with a final column 1,108,364 (sum of the preceding = 1,108,329), i.e. sub-totals plus a total — but which column
      is the national figure cannot be verified without labels. Note: 424,744 belongs to the ''French'' row of the same
      sheet. count=null until the ABS ancestry table is read with headers (backlog).'
  notes:
    el: 'ABS 2021, ancestry: Greek.'
    en: 'ABS 2021, ancestry: Greek.'
