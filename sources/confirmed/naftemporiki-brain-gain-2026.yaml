notes:
  el: 'Φέρει τα ακριβή μεγέθη που η key-findings σελίδα του OECD στρογγυλοποιεί (46.091 αντί 46.000, 36.931
    αντί 37.000) και το 2024 (51.993 επιστροφές, 32.141 αναχωρήσεις). Εσωτερικός έλεγχος συμβατότητας:
    46.091 + 51.993 = 98.084 και 36.931 + 32.141 = 69.072, που ταιριάζουν με το «περίπου 98.000 επέστρεψαν,
    69.000 αναχώρησαν» για τη διετία.'
  en: 'Carries the exact figures the OECD key-findings page rounds (46,091 not 46,000; 36,931 not 37,000)
    and the 2024 values (51,993 returns, 32,141 departures). Internal consistency check: 46,091 + 51,993
    = 98,084 and 36,931 + 32,141 = 69,072, matching the article''s ''about 98,000 returned, 69,000 left''
    for the two years.'
