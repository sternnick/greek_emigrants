notes:
  el: 'Φέρει δύο στοιχεία: το ισοζύγιο 2023 (47.200 επιστροφές έναντι 32.800 εκροών) και τη σωρευτική
    επιστροφή 400.000 από τους 600.000 της περιόδου της κρίσης, η οποία αποδίδεται ρητά σε στοιχεία της
    Eurostat σε ξεχωριστή ανακοίνωση για το Brain ReGain.'
  en: 'Carries two figures: the 2023 balance (47,200 returns against 32,800 departures) and the cumulative
    return of 400,000 of the 600,000 who left during the crisis, which a separate Brain ReGain statement
    attributes explicitly to Eurostat.'
